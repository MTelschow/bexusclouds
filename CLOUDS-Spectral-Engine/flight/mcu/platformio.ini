; CLOUDS FSW-MCU - PlatformIO project (SED 4.11i: PlatformIO + Pico SDK).
;
; UNIT TESTS (host, no hardware):   pio test -e native
; The firmware itself is built with the official Pico SDK via CMake
; (see CMakeLists.txt + README.md) because PlatformIO's RP2350 pico-sdk
; support is still maturing. The native env below compiles only the
; portable core + tests.
;
; No PlatformIO? test/run_native.sh does the same with plain cc.

[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
build_flags = -Wall -Wextra -std=c11
build_src_filter = +<core/>
