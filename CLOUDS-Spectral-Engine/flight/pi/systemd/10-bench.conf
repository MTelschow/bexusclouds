# BENCH OVERRIDE - remove this file once the RP2350 is wired to the Pi UART.
#
# No RP2350 is attached and the Pi has no /dev/ttyAMA0 (UART not enabled in
# config.txt; the serial console still owns serial0). SerialTransport opens
# uart_port eagerly, so the stock ExecStart would fail on every start and
# Restart=always would turn that into a crash loop.
#
# --no-uart stubs ONLY the UART: the real spectrometer is still used.
# Deleting this file (+ daemon-reload) restores stock flight behaviour.
[Service]
ExecStart=
ExecStart=/usr/bin/python3 -m clouds_fsw.main --config /etc/clouds/fsw.json --no-uart
